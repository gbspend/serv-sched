<script>

class Person {
    // name is String, isIA is bool (false=instructor), grades is list of ints (0=K)
    constructor(name, isIA, grades) {
        this.name = name;
        this.isIA = isIA;
        this.grades = grades;
    }
}

class Service {
	//name, grade teacher are student info; just pull it from the sheet (NOT separate student class)
	
	//name, teacher is String
	//grade is int (0=K)
	//cat is category... string?
	//isSupport is bool (false=instruction)
	//isPushIn is bool:
	//	true = MUST push in
	//	false = MUST pull out
	//time is int (minutes)
	constructor(name, grade, teacher, cat, isSupport, isPushIn, time) {
		this.name = name;
		this.grade = grade;
		this.teacher = teacher;
		this.cat = cat;
		this.isSupport = isSupport;
		this.isPushIn = isPushIn;
		this.time = time;
		this.tries = 0;
	}
	
	//use service grade (and teacher if necessary) to get correct sched from masterSched
	getSched(){
		let sched = null;
		let k = this.grade;
		if (Object.hasOwn(masterSched,k)){
			sched = masterSched[k];
		}
		else{
			k += "; "+this.teacher;
			if (Object.hasOwn(masterSched,k)){
				sched = masterSched[k];
			}
			else{
				throw new Error("Service class/teacher not in master schedule: "+s.toEntry());
			}
		}
		return sched;
	}
	
	//return list of Service objects that are this Service split into 10 minute times
	split(){
		const ret = [];
		for(let i=0; i<this.time; i+=10){
			ret.push(new this.constructor(
				this.name,
				this.grade,
				this.teacher,
				this.cat,
				this.isSupport,
				this.isPushIn,
				10
			));
		}
		return ret;
	}
	
	getPriority(){
		if (this.cat == "Resource" || this.cat == "Recess" || this.cat.startsWith("Trans"))
			return 0;
		else if (!this.isSupport)
			return 1;
		else
			return 2;
	}
	
	toEntry(){
		//including grade for overlap purposes; don't need to include that in final output
		return [this.grade, this.teacher, this.cat, this.name, this.isSupport ? "Sup" : "Ins"];
	}
}

let schedData; //raw
let servData; //raw
let personnel;


let blocklabels;
let masterSched; //processed from schedData
let servs; //processed from servData
let solStacks; // list of stacks of potential solutions (one for each priority)
//sol(ution) is object:
//	key is Person's index in `personnel` (one for each)
//	val is a list indexed to 10 min blocks, value is which service

let subStacks; // list of stacks of suboptimal possible solutions (one for each priority)
//identical struct to solStack
//usage: add to this stack when sub optimal option comes up
//		 if solStack is empty and subStack isn't; pop subStack and push that sol onto solStack

let SOLS; //complete solutions! :D
let SUBS; //complete, but suboptimal solutions

let staxMax;

//----------------------------------------------------------------------------------------------------

const personnelRows = document.querySelector('.personnel-rows');
const schedInput = document.getElementById('schedin');
const servInput = document.getElementById('servin');
const genButton = document.getElementById('genBtn');

function addPersonnelRow() {
    const row = document.createElement('div');
    row.className = 'personnel-row';

    row.innerHTML = `
        <input type="text" placeholder="Name">

        <select>
            <option>Instructor</option>
            <option>IA</option>
        </select>

        <div class="personnel-checks">
            <label class="personnel-check"><input type="checkbox"> K</label>
            <label class="personnel-check"><input type="checkbox"> 1</label>
            <label class="personnel-check"><input type="checkbox"> 2</label>
            <label class="personnel-check"><input type="checkbox"> 3</label>
            <label class="personnel-check"><input type="checkbox"> 4</label>
            <label class="personnel-check"><input type="checkbox"> 5</label>
        </div>

        <button type="button" class="personnel-delete" title="Delete person">
            <i class="fa fa-trash"></i>
        </button>
    `;

    personnelRows.insertBefore(row, personnelRows.querySelector('.personnel-add'));
    updateDeleteButtons();
}

function deletePersonnelRow(row) {
    const rows = personnelRows.querySelectorAll('.personnel-row');

    // Always keep at least one personnel row.
    if (rows.length <= 1) {
        return;
    }

    row.remove();
    updateDeleteButtons();
}

function updateDeleteButtons() {
    const rows = personnelRows.querySelectorAll('.personnel-row');
    const deleteButtons = personnelRows.querySelectorAll('.personnel-delete');

    deleteButtons.forEach(button => {
        button.disabled = rows.length <= 1;
        button.style.opacity = rows.length <= 1 ? '0.35' : '1';
        button.style.cursor = rows.length <= 1 ? 'default' : 'pointer';
    });
}

function getPersonnel() {
    const people = [];
    const rows = personnelRows.querySelectorAll('.personnel-row');
    const grades = [0, 1, 2, 3, 4, 5];

    rows.forEach(row => {
        const name = row.querySelector('input[type="text"]').value.trim();
        const isIA = row.querySelector('select').value === 'IA';
        const checkboxes = row.querySelectorAll('.personnel-checks input[type="checkbox"]');
        const checkedGrades = [];

        checkboxes.forEach((checkbox, index) => {
            if (checkbox.checked) {
                checkedGrades.push(grades[index]);
            }
        });

		if (checkedGrades.length == 0)
			throw new Error(name+" doesn't have any grade levels enabled!");
        people.push(new Person(name, isIA, checkedGrades));
    });

    return people;
}

function filesSelected() {
    genButton.disabled = !schedInput.files.length || !servInput.files.length;
}

function readExcelFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = event => {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                resolve(workbook);
            } catch (error) {
                reject(error);
            }
        };

        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
    });
}

//----------------------------------------------------------------------------------------------------

function solDiff(a, b) {
    const differences = [];

    for (const key of Object.keys(a)) {
        const aValues = new Set(a[key]);
        const bValues = new Set(b[key]);

        for (const value of bValues) {
            if (!aValues.has(value)) {
                differences.push(`${key}: added "${value}"`);
            }
        }

        for (const value of aValues) {
            if (!bValues.has(value)) {
                differences.push(`${key}: removed "${value}"`);
            }
        }
    }

    return differences;
}

function entry2Str(e){
	let temp = e.slice(1,-1); //temp has [teacher,serv_cat,name]
	temp[1]+=" "+e[4];
	return temp.join(", ");
}

/*
if (ttype.includes("recess")){
	subcats = ["recess in"];
}
else if (ttype.includes("resource")){
	subcats = ["res_in","res_out"];
}
else if (ttype.includes("begin")){
	subcats = ["begin","end"];
}
*/
function decodeTran(cat){
	if (!cat.startsWith("Trans")) return cat;
	const ttype = cat.split(" ")[1].trim().toLowerCase();
	if (ttype.includes("recess")){
		return "Transition recess in";
	}
	else if(ttype.includes("res_in") || ttype.includes("res_out")){
		return "Transition resource";
	}
	else if(ttype.includes("begin") || ttype.includes("end")){
		return "Transition begin/end day";
	}
}

//toEntry() -> [this.grade, this.teacher, this.cat, this.name, this.isSupport ? "Sup" : "Ins"]
function entriesOutStr(l){
	if (l.length == 0)
		return "";
	let ret = l[0][1]+" - "; //start with teacher from first entry
	let svcs = {};
	for (let le of l){
		let cat = decodeTran(le[2])+" "+le[4];
		if (!Object.hasOwn(svcs,cat))
			svcs[cat] = [];
		svcs[cat].push(le[3]);
	}
	for (let svc of Object.keys(svcs)){
		const ns = svcs[svc].join(", ");
		ret += svc + ": " + ns + "; ";
	}
	return ret.slice(0,-2); //cut off last "; "
}

//take raw sol[p][t] list and raw Service.toEntry() and checks if the list contains that entry
function persTimeHasEntry(pt, e){
	for(let pte of pt){
		if (entry2Str(pte) == entry2Str(pt))
			return true;
	}
	return false;
}

function parseGrade(s){
	let g = s[0].toUpperCase();
	if (g == "K") g = "0";
	return parseInt(g);
}

function roundUp(num){
	return Math.ceil(num / 10) * 10;
}

const NONBEHAV = new Set(["Resource","Recess","Lunch",""]);

function singleTMasterFit(s,t){
	const sched = s.getSched();
	
	let ret = 1;
	
	let entry = sched[t];
	let canPullOut = false;
	const parts = entry.split(";");
	if (parts.length > 1){
		entry = parts[0].trim();
		canPullOut = parts[1].includes("pull out");
	}
	
	if (!s.isPushIn && !canPullOut) //pull out service requires pull out time
		return -1;
	
	let catmatch = s.cat == entry || (s.cat == "Behavior" && !NONBEHAV.has(entry));
	if (s.cat.startsWith("Trans")){
		const ttype = s.cat.split(" ")[1].trim().toLowerCase();
		if (ttype.includes("recess")){
			catmatch = entry == "Recess" && sched[t+1] != "Recess"; //the last 10 min block of recess
		}
		else if (ttype.includes("res_in")){
			catmatch = entry != "Resource" && sched[t+1] == "Resource"; //the 10 min block BEFORE resource
		}
		else if (ttype.includes("res_out")){
			catmatch = entry != "Resource" && sched[t-1] == "Resource"; //the 10 min block AFTER resource
		}
		else if (ttype.includes("begin")){
			catmatch = t == 0;
		}
		else if (ttype.includes("end")){
			catmatch = t == blocklabels.length-1;
		}
	}
	
	if (!s.isPushIn && canPullOut){
		if (!catmatch && !entry.includes("Science") && !entry.includes("Social")){
			ret = 0;
		}
	}
	else if (!catmatch)
		return -1;
	
	return ret;
}
//"does Service s fit in the master schedule at the time slot starting with index t?"
//  NO EXCEPTIONS, NO SPLIT (do that elsewhere)
// returns:
//		-1: doesn't fit
//		0: suboptimal fit
//		1: optimal fit
function masterFit(s,t){
	let ret = 1;
	let tleft = s.time;
	do{
		const singFit = singleTMasterFit(s,t);
		if (singFit < 0)
			return -1;
		if (singFit < ret)
			ret = singFit;
		tleft -= 10;
		t++;
	}while(tleft > 0);
	
	return ret;
}

//[this.grade, this.teacher, this.cat, this.name, this.isSupport ? "Sup" : "Ins"];

//is service s a valid overlap with the other services at that time?
//		others <- sched[p][t] and contains Service.toEntry() "tuples": grade,teach,cat,name
function validOverlap(others, s){
	//special recess support and recess transition check (move??)
	for (let tup of others){
		if (
			tup[2].toLowerCase().includes("recess") &&
			s.cat.toLowerCase().includes("recess") &&
			tup[3] == s.name
		)
		return true;
	}
	if (others.length >= 4)
		return false;
	//category doesn't matter!
	for (let tup of others){
		if (tup[3] == s.name) //can only give 1 service to a certain kid at a time
			return false;
		if (s.isPushIn){ //for push in; (grade and) teacher has to match
			if (tup[1] != s.teacher)
				return false;
		}
		else{ //is pull out; just grade needs to match
			if (tup[0] != s.grade)
				return false;
		}
	}
	return true;
}

//"for the given sol[ution] does Service s fit in Person with index p's schedule at the time slot starting with index t?"
//  call AFTER checking masterFit
// returns:
//		-1: doesn't fit
//		0: suboptimal fit
//		1: optimal fit
function personFit(sol,s,p,t){
	const person = personnel[p];
	
	//HARDCODE: Becca can't go to Kelly (she said "pull out from Kelly wouldn't happen" /shrug)
	if(person.name.includes("Spendlove") && s.teacher.includes("Kelly"))
		return -1;
	
	
	if (!s.isSupport && person.isIA)
		return -1;
	
	let ret = 1;
	
	if(s.isSupport && !person.isIA)
		ret = 0;
		
	if(!person.grades.includes(s.grade))
		ret = 0;
	
	//check if person is available for duration of service
	let tleft = s.time;
	do{
		
		//if this person already has this service: then no
		if(persTimeHasEntry(sol[p][t],s.toEntry()))
			return -1;
			
		//New rule: if another Person is serving teacher, then this Person can't serve same teacher
		for(let op=0; op<personnel.length; op++){
			if (op == p) continue; //all OTHER personnel
			//only need to check sol[op][t][0] because all entries will be same teacher
			if(sol[op][t].length > 0 && sol[op][t][0][1] == s.teacher)
				return -1;
		}
		
		if(sol[p][t].length > 0){ //already busy, so can only overlap
			if(!validOverlap(sol[p][t],s))
				return -1;
			else
				ret = 1; //prioritize overlap (even if otherwise subopt)
		}
		tleft -= 10;
		t++;
	}while(tleft > 0);
	
	return ret;
}

//return list of [person,time,fit] tuples
//	person is index into Personnel
//	time is index into masterSched/sol[p]
//	fit is 0 for sub, 1 for opt (as above)
function findAllFits(sol,curr){
	let ret = [];
	//FIXED: go backwards so that earlier times are on top of stack
	for (let t=blocklabels.length-1; t>=0; t--){
		const mfit = masterFit(curr,t);
		if(mfit < 0){ //just doesn't fit
			continue;
		}
		
		for (let p=0; p<personnel.length; p++){
			const pfit = personFit(sol,curr,p,t);
			if (pfit < 0){
				continue;
			}
			let fit = 1;
			if (pfit == 0 || mfit == 0)
				fit = 0;
			ret.push([p,t,fit]);
		}
	}
	return ret;
}

function emptySol(){
	let sol = {};
	for (let p=0; p<personnel.length; p++){
		sol[p] = Array.from({ length: blocklabels.length }, () => []);
	}
	return sol;
}

//comparator for sorting services
function servComp(a,b){
	const aBeh = a.cat.includes("Behav");
	const bBeh = b.cat.includes("Behav");
	if(aBeh && !bBeh)
		return 1;
	else if(!aBeh && bBeh)
		return -1;
	
	const sol = emptySol();
	const afits = findAllFits(sol,a).length;
	const bfits = findAllFits(sol,b).length;
	if (afits == bfits)
		return 0;
	else if (afits > bfits)
		return 1; //b should come first
	else //bfits > afits
		return -1;
}

//gen solution for given list of services, starting with `sol` (emptySol())
//	DOESN'T RETURN: clears and fills SOLS (and SUBS)
function solveServices(inservs, sol){
	//sort servs here
	const servs = [];
	for (let pl of inservs){
		pl.sort(servComp);
		servs.push(pl);
	}
	
	//each entry is a stack of [sol, next_i] tuples (for the priority matching list index)
	//next_i is the next serv index to try to add to the sol (simple inc)
	//sol[ution] is objs with
	//	Person's index in `personnel` as key and
	//	val as list of services in 10 min incs
	//		each service (list element) is itself a list [teach, svcat, stud] tuples
	//			(use Service.toEntry())
	solStacks = Array.from({ length: servs.length }, () => []);
	subStacks = Array.from({ length: servs.length }, () => []);
	
	solStacks[0].push([sol,0]);
	
	function sol2Str(sl){
		let ret = "";
		for (let p=0; p<personnel.length; p++){
			ret += sl[p].map(row => row.join(',')).join('\n');
		}
		return ret;
	}
	
	SOLS = []; //complete solutions! :D
	SUBS = []; //complete, but suboptimal solutions
	let opts = 0; //just curious: stat of how many options are explored
	
	staxMax = [0,0,0];
	
	let diffSOLS = 10; //SOLS from different "origins"
	
	//use `const deepCopy = structuredClone(original);` to copy sol objs!
	while(true){
		//get current highest pi
		if(diffSOLS < 0)
			break; //enough SOLUTION FOUND!! :D
		let foundSOL = false; //one per sol
		let pi = 0;
		if (solStacks[2].length > 0)
			pi = 2;
		else if (solStacks[1].length > 0)
			pi = 1;
		const lastpi = pi == servs.length-1;
		
		//TEMP record stats...
		for(let i=0; i<3; i++){
			if (solStacks[i].length == 0)
				continue;
			staxMax[i] = Math.max(staxMax[i], solStacks[i].at(-1)[1]);
		}
		opts++;
		//TEMP ^
		
		//FIXED: moved to top of loop, because bottom doesn't have next pi.
		//when solStacks[pi] is empty AND we're desperate (no sols in next pi or SOLS, where approp.):
		//then copy over the top suboptimal solution and keep going
		if (((!lastpi && solStacks[pi+1].length == 0) || (lastpi && SOLS.length == 0)) &&
			solStacks[pi].length == 0 && subStacks[pi].length > 0){
			solStacks[pi].push(subStacks[pi].pop()); //move top suboptimal to sol
		}
		
		//pop solution stack
		if(solStacks[pi].length == 0){
			console.log(solStacks);
			console.log(subStacks);
			throw new Error("solStacks[pi].length == 0");
		}
		let [sol, next_i] = solStacks[pi].pop();
		
		const lastserv = next_i == servs[pi].length-1;
		const curr = servs[pi][next_i];
		//console.log("Fitting",pi,next_i,":",curr);
		
		curr.tries++;
		if (curr.tries > 100){
			//console.log("Giving up on:",curr);
			//console.log("Moving on to:",next_i+1);
			
			if (next_i+1 >= servs[pi].length){
				next_i = 0;
				pi++;
			}
			if (pi >= servs.length){
				SOLS.push(sol);
				foundSOL = true;
			}
			else
				solStacks[pi].push([sol,next_i+1]);
			continue;
		}
		//if(staxMax[pi] == next_i) console.log("Fitting",pi,next_i,":",curr);
		//if(staxMax[pi] == next_i) console.log(solStacks[pi].length,"left");
		
		let anyopt = false;
		let anysub = false;
		
		for(let tup of findAllFits(sol,curr)){
			const [p,t,fit] = tup;
			const solCopy = structuredClone(sol);
			
			let tleft = curr.time;
			let st = t;
			do{
				solCopy[p][st].push(curr.toEntry());
				tleft -= 10;
				st++;
			}while(tleft > 0);
			
			
			//if(staxMax[pi] == next_i) console.log("\tpfit found: ",p,t,solCopy[p][t].length);
			
			if (fit > 0){ //optimal
				anyopt = true;
				if(!lastserv){
					solStacks[pi].push([solCopy,next_i+1]);
				}
				else if (!lastpi){
					solStacks[pi+1].push([solCopy,0]);
				}
				else{
					SOLS.push(solCopy);
					foundSOL = true;
				}
			}
			else { //suboptimal
				anysub = true;
				if(!lastserv){
					subStacks[pi].push([solCopy,next_i+1]);
				}
				else if (!lastpi){
					subStacks[pi+1].push([solCopy,0]);
				}
				else{
					SUBS.push(solCopy);
				}
			}
		}
		
		//TODO: revisit?
		if(!anyopt && anysub){ //no opt found, but 1+ sub was, so treat one sub as opt ("best we've got")
			solStacks[pi].push(subStacks[pi].pop());
		}
		
		//TODO: Try splitting Services!
		//AFTER: add ALL split-up versions of this service to the suboptimal stack (right??)
		//	create a solCopy, call curr.split(), try to fit each 10 minute split-Serv in...? BUT THE OPTIONS?!!!??!
		
		if(foundSOL) diffSOLS--;
	}
	
	console.log("Considered",opts,"options");
}

async function generateSchedule() {
    if (!schedInput.files.length || !servInput.files.length) {
        return;
    }

	let ready = false;
    try {
		const selectElement = document.getElementById("reduce-sel");
		const reduceVal = selectElement.value;
	
        // Load each Excel file into its own workbook variable.
        scheduleWorkbook = await readExcelFile(schedInput.files[0]);
        servicesWorkbook = await readExcelFile(servInput.files[0]);
		
		const scheduleSheet = scheduleWorkbook.Sheets[scheduleWorkbook.SheetNames[0]];
		const servicesSheet = servicesWorkbook.Sheets[servicesWorkbook.SheetNames[0]];

		//load globals
		schedData = XLSX.utils.sheet_to_json(scheduleSheet, { header: 1 });
		servData  = XLSX.utils.sheet_to_json(servicesSheet, { header: 1 });
		
        // Load the Personnel UI into a list of Person objects.
		
		if (true){ // change to false for DEBUG personnel
        personnel = getPersonnel();
		}
		else{
			//!!! TEMP REMOVE !!!!!!!!!!!!!!!!!!!!!!!!
			personnel = [ { "name": "Spendlove", "isIA": false, "grades": [ 2, 4, 5 ] }, { "name": "Wheeler", "isIA": false, "grades": [ 0, 1, 3 ] }, { "name": "Reid", "isIA": true, "grades": [ 4, 5 ] }, { "name": "Harrup", "isIA": true, "grades": [ 1, 2, 3 ] }, { "name": "Givens", "isIA": true, "grades": [ 0 ] },
			/*
			{ "name": "TEMP1", "isIA": true, "grades": [ 0,1,2,3,4,5 ] },
			{ "name": "TEMP2", "isIA": true, "grades": [ 0,1,2,3,4,5 ] },
			
			{ "name": "TEMP3", "isIA": true, "grades": [ 0,1,2,3,4,5 ] },
			{ "name": "TEMP4", "isIA": true, "grades": [ 0,1,2,3,4,5 ] },
			{ "name": "TEMP5", "isIA": true, "grades": [ 0,1,2,3,4,5 ] },
			*/
			]
			//!!! TEMP REMOVE !!!!!!!!!!!!!!!!!!!!!!!!
		}
		

        console.log('Schedule data:', schedData);
        console.log('Services data:', servData);
        console.log('Personnel:', personnel);

		//when reading from sched, block is stored as next index in sched[grade] list,
		//	so store the labels here:
		//	blocklabels[i] is the label for sched[grade][i]
		blocklabels = [];
		for (let i=1; i<schedData.length; i++){
			const row = schedData[i];
			if(row === undefined || row[0] === undefined)
				break;
			blocklabels.push(row[0]);
		}

		//key is grade # (0=K)
		//val is list of 10-min blocks in order
		masterSched = {}
		
		let classes = schedData[0].slice(2); //excl blank above time label and "K"
		classes.unshift(0);
		classes = classes.map(String);
		for (let cls of classes){
			cls = cls.trim();
			if (cls.length > 0){
				if (cls == "K") cls = 0; //huh, js object keys don't distinguish between int and Str /shrug
				masterSched[cls] = [];
			}
		}
		
		const schedCats = new Set();
		
		for (let i=1; i<schedData.length; i++){
			const row = schedData[i];
			if (row.length == 0)
				break;
			for (let j=0; j<classes.length; j++){
				const cls = classes[j];
				let entry = row[j+1];
				if (entry === undefined || entry == "Switch Classes") entry = "";
				masterSched[cls].push(entry);
				
				const pre = entry.split(";")[0].trim();
				schedCats.add(pre);
			}
		}
		
		console.log("Loaded master sched:",masterSched);
		
		servs = [[],[],[]]; //list of "priority classes", which are lists of Service obj
		Kservs = [[],[],[]];
		const servcats = new Set(); //set of seen service categories, for validation
		
		for (let i=1; i<servData.length; i++){
			const row = servData[i];
			if (row.length == 0 || row[0].trim().length == 0) continue;
			
			let cat = row[4];
			if (cat.startsWith("Trans")){
				let subcats = null;
				const ttype = cat.split(" ")[1].trim().toLowerCase();
				if (ttype.includes("recess")){
					subcats = ["recess in"];
				}
				else if (ttype.includes("resource")){
					subcats = ["res_in","res_out"];
				}
				else if (ttype.includes("begin")){
					subcats = ["begin","end"];
				}
				for (let subcat of subcats){
					//Service(name, grade, teacher, cat, isSupport, isPushIn, time)
					const s = new Service(
						row[0],
						parseGrade(row[2]),
						row[3],
						"Transition "+subcat,
						row[5].toUpperCase() == "SUPPORT",
						row[9][0].toUpperCase() == "G",
						10
					);
					const pi = s.getPriority();
					s.grade==0 ? Kservs[pi].unshift(s) : servs[pi].unshift(s);
				}
			}
			else{
				let time = roundUp(parseInt(row[7]));
				if (reduceVal == "3/4"){
					time = roundUp(time*.75);
				}
				else if (reduceVal == "Half"){
					time = roundUp(time*.5);
				}
				const ts = [];
				if (time <= 40){
					ts.push(time);
				}
				else{
					while(true){
						if (time >= 60){
							time -= 30;
							ts.push(30);
						}
						else if (time == 50){
							ts.push(30);
							ts.push(20);
							break;
						}
						else if (time == 40){
							ts.push(20);
							ts.push(20);
							break;
						}
						else{
							ts.push(time);
							break;
						}
					}
				}
				for (const t of ts){
					//Service(name, grade, teacher, cat, isSupport, isPushIn, time)
					const s = new Service(
						row[0],
						parseGrade(row[2]),
						row[3],
						cat,
						row[5].toUpperCase() == "SUPPORT",
						row[9][0].toUpperCase() == "G",
						t
					);
					if (!s.cat.startsWith("Trans") && !s.cat.startsWith("Behav")) //transitions and behavior don't appear on master sched
						servcats.add(s.cat);
					
					const pi = s.getPriority();
					if(s.cat.includes("Behav"))
						//Add Behavs to BOTTOM of stack because they're flexible
						s.grade==0 ? Kservs[pi].push(s) : servs[pi].push(s);
					else
						s.grade==0 ? Kservs[pi].unshift(s) : servs[pi].unshift(s);
				}
			}
		}
		
		console.log("Loaded services:",servs);
		console.log("Loaded KINDER servs:",Kservs);
		
		//validate
		if (!servcats.isSubsetOf(schedCats)){
			const missing = servcats.difference(schedCats);
			const msg = "Some service categories don't appear on master schedule: "+[...missing].join(', ');
			alert("ERROR! "+msg);
			throw new Error(msg);
		}
		console.log("Sched entries that aren't in service cats: ",schedCats.difference(servcats));
		
		for(let k of Object.keys(masterSched)){
			if (masterSched[k].length != blocklabels.length){
				throw new Error("sched "+k+" len != labels len: "+ masterSched[k].length+ " vs. "+ blocklabels.length);
			}
		}
		
		ready = true;
    } catch (error) {
        console.error('Error loading data:', error);
        alert('There was a problem loading the data.');
    }
	
	if (!ready) return;
	console.log("---------------------------");
	
	// =====================================================
	// Schedule-generation logic
	try{
		solveServices(Kservs, emptySol());
		if(SOLS.length == 0)
			throw new Error("Couldn't complete Kinder schedule before moving on to non-Kinder");
		const KCopy = structuredClone(SOLS[0]);
		solveServices(servs, KCopy);
		ready = true;
	} catch (error) {
        console.error('Error generating schedule:', error);
        alert('There was a problem generating the schedule.');
    }
	
	if (!ready) return;
	
	console.log("SOLS:",SOLS);
	
	function solHasE(sol,e){
		for(let p of Object.keys(sol)){
			for(let l of sol[p]){
				for(let le of l){
					if (entry2Str(le) == entry2Str(e))
						return true;
				}
			}
		}
		return false;
	}
	
	let sol = null;
	let miss = null;
	
	for(let currsol of SOLS){
		let currmiss = [];
		for(let k of Object.keys(servs)){
			for(let s of servs[k]){
				let e = s.toEntry();
				let found = false;
				if (!solHasE(currsol,e))
					currmiss.push(s);
			}
		}
		console.log("\tcandidate misses:",currmiss.length);
		if (miss === null || currmiss.length < miss.length){
			sol = currsol;
			miss = currmiss;
		}
	}
	
	console.log("Selected solution:",sol);
	console.log("Misses:",miss);
	
	if(miss.length > 0){
		const parent = document.getElementById('missing-ul');
		parent.replaceChildren();
		document.getElementById("results").style.display = "block";
		for (let ms of miss){
			const li = document.createElement("li");
			li.textContent = entry2Str(ms.toEntry());
			parent.appendChild(li);
		}
	}
	
	//prep data
	const row1 = [""];
	for (let p of personnel){
		row1.push(p.name);
	}
	const data = [row1];
	for(let i=0; i<blocklabels.length;i++){
		const row = [blocklabels[i]];
		for(let p of Object.keys(sol)){
			row.push(entriesOutStr(sol[p][i]));
		}
		data.push(row);
	}
	
	//TEMP: direct download
	const workbook = XLSX.utils.book_new();
	const worksheet = XLSX.utils.aoa_to_sheet(data);
	XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");

	// Triggers an automatic browser download
	XLSX.writeFile(workbook, "ComputedSchedule.xlsx");
	
	// =====================================================
}

async function runSchedule() {
    const loadingOverlay = document.getElementById('loadingOverlay');

    loadingOverlay.style.display = 'flex';
	genButton.disabled = true;
	document.getElementById("results").style.display = "none";

    // Give the browser time to display the overlay
    await new Promise(resolve => setTimeout(resolve, 0));

    try {
        await generateSchedule();
    } finally {
        loadingOverlay.style.display = 'none';
		filesSelected();
    }
}
