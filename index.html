<script>

class Person {
    // name is String, isIA is bool (false=instructor), grades is list of ints (0=K)
    constructor(name, isIA, grades) {
        this.name = name;
        this.isIA = isIA;
        this.grades = grades;
    }
}

class Service {
	//name, grade teacher are student info; just pull it from the sheet (NOT separate student class)
	
	//name, teacher is String
	//grade is int (0=K)
	//cat is category... string?
	//isSupport is bool (false=instruction)
	//isPushIn is bool:
	//	true = MUST push in
	//	false = MUST pull out
	//time is int (minutes)
	constructor(name, grade, teacher, cat, isSupport, isPushIn, time) {
		this.name = name;
		this.grade = grade;
		this.teacher = teacher;
		this.cat = cat;
		this.isSupport = isSupport;
		this.isPushIn = isPushIn;
		this.time = time;
	}
	
	//use service grade (and teacher if necessary) to get correct sched from masterSched
	getSched(){
		let sched = null;
		let k = this.grade;
		if (Object.hasOwn(masterSched,k)){
			sched = masterSched[k];
		}
		else{
			k += "; "+this.teacher;
			if (Object.hasOwn(masterSched,k)){
				sched = masterSched[k];
			}
			else{
				throw new Error("Service class/teacher not in master schedule: "+this.toEntry());
			}
		}
		return sched;
	}
	
	//return list of Service objects that are this Service split into 10 minute times
	split(){
		const ret = [];
		for(let i=0; i<this.time; i+=10){
			ret.push(new this.constructor(
				this.name,
				this.grade,
				this.teacher,
				this.cat,
				this.isSupport,
				this.isPushIn,
				10
			));
		}
		return ret;
	}
	
	getPriority(){
		if (this.cat == "Resource" || this.cat == "Recess" || this.cat.startsWith("Trans"))
			return 0;
		else if (!this.isSupport)
			return 1;
		else
			return 2;
	}
	
	toEntry(){
		//including grade for overlap purposes; don't need to include that in final output
		return [this.grade, this.teacher, this.cat, this.name, this.isSupport ? "Sup" : "Ins"];
	}
}

let schedData; //raw
let servData; //raw
let personnel;


let blocklabels;
let masterSched; //processed from schedData
let servs; //processed from servData
let Kservs; //processed from servData
let solStacks; // list of stacks of potential solutions (one for each priority)
//sol(ution) is object:
//	key is Person's index in `personnel` (one for each)
//	val is a list indexed to 10 min blocks, value is which service

let subStacks; // list of stacks of suboptimal possible solutions (one for each priority)
//identical struct to solStack
//usage: add to this stack when sub optimal option comes up
//		 if solStack is empty and subStack isn't; pop subStack and push that sol onto solStack

let SOLS; //complete solutions! :D
let SUBS; //complete, but suboptimal solutions

let staxMax;

//----------------------------------------------------------------------------------------------------

const personnelRows = document.querySelector('.personnel-rows');
const schedInput = document.getElementById('schedin');
const servInput = document.getElementById('servin');
const genButton = document.getElementById('genBtn');

function addPersonnelRow() {
    const row = document.createElement('div');
    row.className = 'personnel-row';

    row.innerHTML = `
        <input type="text" placeholder="Name">

        <select>
            <option>Instructor</option>
            <option>IA</option>
        </select>

        <div class="personnel-checks">
            <label class="personnel-check"><input type="checkbox"> K</label>
            <label class="personnel-check"><input type="checkbox"> 1</label>
            <label class="personnel-check"><input type="checkbox"> 2</label>
            <label class="personnel-check"><input type="checkbox"> 3</label>
            <label class="personnel-check"><input type="checkbox"> 4</label>
            <label class="personnel-check"><input type="checkbox"> 5</label>
        </div>

        <button type="button" class="personnel-delete" title="Delete person">
            <i class="fa fa-trash"></i>
        </button>
    `;

    personnelRows.insertBefore(row, personnelRows.querySelector('.personnel-add'));
    updateDeleteButtons();
}

function deletePersonnelRow(row) {
    const rows = personnelRows.querySelectorAll('.personnel-row');

    // Always keep at least one personnel row.
    if (rows.length <= 1) {
        return;
    }

    row.remove();
    updateDeleteButtons();
}

function updateDeleteButtons() {
    const rows = personnelRows.querySelectorAll('.personnel-row');
    const deleteButtons = personnelRows.querySelectorAll('.personnel-delete');

    deleteButtons.forEach(button => {
        button.disabled = rows.length <= 1;
        button.style.opacity = rows.length <= 1 ? '0.35' : '1';
        button.style.cursor = rows.length <= 1 ? 'default' : 'pointer';
    });
}

function getPersonnel() {
    const people = [];
    const rows = personnelRows.querySelectorAll('.personnel-row');
    const grades = [0, 1, 2, 3, 4, 5];

    rows.forEach(row => {
        const name = row.querySelector('input[type="text"]').value.trim();
        const isIA = row.querySelector('select').value === 'IA';
        const checkboxes = row.querySelectorAll('.personnel-checks input[type="checkbox"]');
        const checkedGrades = [];

        checkboxes.forEach((checkbox, index) => {
            if (checkbox.checked) {
                checkedGrades.push(grades[index]);
            }
        });

		if (checkedGrades.length == 0)
			throw new Error(name+" doesn't have any grade levels enabled!");
        people.push(new Person(name, isIA, checkedGrades));
    });

    return people;
}

function filesSelected() {
    genButton.disabled = !schedInput.files.length || !servInput.files.length;
}

function readExcelFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = event => {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                resolve(workbook);
            } catch (error) {
                reject(error);
            }
        };

        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
    });
}

//----------------------------------------------------------------------------------------------------

// --- Search randomization + diversity (used by solveServices) -----------------

const SEARCH_SEED = 0x9E3779B9;   // fixed => deterministic output for identical inputs
const DIVERSITY_MIN_CELLS = 4;    // min differing (person,block) cells for two SOLS to count as distinct
const SEARCH_MAX_OPTS = 400000;   // soft cap on explored options once >=1 schedule exists
const SEARCH_MAX_MS = 20000;      // soft wall-clock cap once >=1 schedule exists
const SEARCH_HARD_OPTS = 1000000; // absolute backstop against an infinite loop

// --- Constraint-aware constructor (MRV/LCV) + ejection-chain repair ----------
const LCV_PROBE_LIMIT  = 12;   // how many remaining services to weigh when scoring a slot
const LCV_FIT_LIMIT    = 10;   // how many candidate slots to score per service
const LCV_OPT_BONUS    = 5;    // reward a non-suboptimal placement
const LCV_ADJ_BONUS    = 2;    // reward placements that don't fragment a person's free time
const LCV_GRADE_BONUS  = 3;    // reward giving a service to someone assigned that grade
const EJECT_DEPTH      = 2;    // how deep the repair chain may displace services
const EJECT_MAX_BLOCKERS = 4;  // skip a slot whose chain would have to move more than this
const REPAIR_MAX_ITERS = 4;    // repair sweeps over the miss list
const KBASE_LIMIT      = 2;    // distinct Kinder bases to build non-Kinder schedules on

let searchSeed = SEARCH_SEED;
function srand() {
    // mulberry32 PRNG
    searchSeed |= 0;
    searchSeed = (searchSeed + 0x6D2B79F5) | 0;
    let t = Math.imul(searchSeed ^ (searchSeed >>> 15), 1 | searchSeed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(srand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// stable string key for one sol[p][t] cell (a list of Service.toEntry() tuples)
function blockKey(cell) {
    return cell.map(e => e.join('|')).sort().join(' / ');
}

// list of "person@block" cells where solutions a and b disagree (a real distance metric)
function solDiff(a, b) {
    const differences = [];
    for (const key of Object.keys(a)) {
        const aRow = a[key] || [];
        const bRow = b[key] || [];
        const n = Math.max(aRow.length, bRow.length);
        for (let t = 0; t < n; t++) {
            const av = blockKey(aRow[t] || []);
            const bv = blockKey(bRow[t] || []);
            if (av !== bv) {
                differences.push(`${key}@${t}: "${av}" -> "${bv}"`);
            }
        }
    }
    return differences;
}

// is `cand` far enough from every already-accepted solution to count as a distinct schedule?
function isDiverse(cand, accepted) {
    for (const s of accepted) {
        if (solDiff(cand, s).length < DIVERSITY_MIN_CELLS) {
            return false;
        }
    }
    return true;
}

function entry2Str(e){
	let temp = e.slice(1,-1); //temp has [teacher,serv_cat,name]
	temp[1]+=" "+e[4];
	return temp.join(", ");
}

/*
if (ttype.includes("recess")){
	subcats = ["recess in"];
}
else if (ttype.includes("resource")){
	subcats = ["res_in","res_out"];
}
else if (ttype.includes("begin")){
	subcats = ["begin","end"];
}
*/
function decodeTran(cat){
	if (!cat.startsWith("Trans")) return cat;
	const ttype = cat.split(" ")[1].trim().toLowerCase();
	if (ttype.includes("recess")){
		return "Transition recess in";
	}
	else if(ttype.includes("res_in") || ttype.includes("res_out")){
		return "Transition resource";
	}
	else if(ttype.includes("begin") || ttype.includes("end")){
		return "Transition begin/end day";
	}
	else
		throw new Error("Invalid Transition type:",ttype);
}

//toEntry() -> [this.grade, this.teacher, this.cat, this.name, this.isSupport ? "Sup" : "Ins"]
function entriesOutStr(l){
	if (l.length == 0)
		return "";
	let ret = l[0][1]+" - "; //start with teacher from first entry
	let svcs = {};
	for (let le of l){
		let cat = decodeTran(le[2])+" "+le[4];
		if (!Object.hasOwn(svcs,cat))
			svcs[cat] = [];
		svcs[cat].push(le[3]);
	}
	for (let svc of Object.keys(svcs)){
		const ns = svcs[svc].join(", ");
		ret += svc + ": " + ns + "; ";
	}
	return ret.slice(0,-2); //cut off last "; "
}

//take raw sol[p][t] list and raw Service.toEntry() and checks if the list contains that entry
function persTimeHasEntry(pt, e){
	for(let pte of pt){
		if (entry2Str(pte) == entry2Str(e))
			return true;
	}
	return false;
}

function parseGrade(s){
	let g = s[0].toUpperCase();
	if (g == "K") g = "0";
	return parseInt(g);
}

function roundUp(num){
	return Math.ceil(num / 10) * 10;
}

const NONBEHAV = new Set(["Resource","Recess","Lunch",""]);

function singleTMasterFit(s,t){
	const sched = s.getSched();

	if (t < 0 || t >= sched.length) return -1; //off the end of the day

	let ret = 1;

	let entry = sched[t];
	let canPullOut = false;
	const parts = entry.split(";");
	if (parts.length > 1){
		entry = parts[0].trim();
		canPullOut = parts[1].includes("pull out");
	}
	
	if (!s.isPushIn && !canPullOut) //pull out service requires pull out time
		return -1;
	
	let catmatch = s.cat == entry || (s.cat == "Behavior" && !NONBEHAV.has(entry));
	if (s.cat.startsWith("Trans")){
		const ttype = s.cat.split(" ")[1].trim().toLowerCase();
		if (ttype.includes("recess")){
			catmatch = entry == "Recess" && sched[t+1] != "Recess"; //the last 10 min block of recess
		}
		else if (ttype.includes("res_in")){
			catmatch = entry != "Resource" && sched[t+1] == "Resource"; //the 10 min block BEFORE resource
		}
		else if (ttype.includes("res_out")){
			catmatch = entry != "Resource" && sched[t-1] == "Resource"; //the 10 min block AFTER resource
		}
		else if (ttype.includes("begin")){
			catmatch = t == 0;
		}
		else if (ttype.includes("end")){
			catmatch = t == blocklabels.length-1;
		}
	}
	
	if (!s.isPushIn && canPullOut){
		if (!catmatch && !entry.includes("Science") && !entry.includes("Social")){
			ret = 0;
		}
	}
	else if (!catmatch)
		return -1;
	
	return ret;
}
//"does Service s fit in the master schedule at the time slot starting with index t?"
//  NO EXCEPTIONS, NO SPLIT (do that elsewhere)
// returns:
//		-1: doesn't fit
//		0: suboptimal fit
//		1: optimal fit
function masterFit(s,t){
	let ret = 1;
	let tleft = s.time;
	do{
		const singFit = singleTMasterFit(s,t);
		if (singFit < 0)
			return -1;
		if (singFit < ret)
			ret = singFit;
		tleft -= 10;
		t++;
	}while(tleft > 0);
	
	return ret;
}

//[this.grade, this.teacher, this.cat, this.name, this.isSupport ? "Sup" : "Ins"];

//is service s a valid overlap with the other services at that time?
//		others <- sched[p][t] and contains Service.toEntry() "tuples": grade,teach,cat,name
function validOverlap(others, s){
	//special recess support and recess transition check (move??)
	for (let tup of others){
		if (
			tup[2].toLowerCase().includes("recess") &&
			s.cat.toLowerCase().includes("recess") &&
			tup[3] == s.name
		)
		return true;
	}
	if (others.length >= 4)
		return false;
	//category doesn't matter!
	for (let tup of others){
		if (tup[3] == s.name) //can only give 1 service to a certain kid at a time
			return false;
		if (s.isPushIn){ //for push in; (grade and) teacher has to match
			if (tup[1] != s.teacher)
				return false;
		}
		else{ //is pull out; just grade needs to match
			if (tup[0] != s.grade)
				return false;
		}
	}
	return true;
}

//"for the given sol[ution] does Service s fit in Person with index p's schedule at the time slot starting with index t?"
//  call AFTER checking masterFit
// returns:
//		-1: doesn't fit
//		0: suboptimal fit
//		1: optimal fit
function personFit(sol,s,p,t){
	const person = personnel[p];
	
	//HARDCODE: Becca can't go to Kelly (she said "pull out from Kelly wouldn't happen" /shrug)
	if(person.name.includes("Spendlove") && s.teacher.includes("Kelly"))
		return -1;
	
	
	if (!s.isSupport && person.isIA)
		return -1;
	
	let ret = 1;
	
	if(s.isSupport && !person.isIA)
		ret = 0;
		
	if(!person.grades.includes(s.grade))
		ret = 0;
	
	//check if person is available for duration of service
	let tleft = s.time;
	do{
		
		//if this person already has this service: then no
		if(persTimeHasEntry(sol[p][t],s.toEntry()))
			return -1;
			
		//New rule: if another Person is serving teacher, then this Person can't serve same teacher
		for(let op=0; op<personnel.length; op++){
			if (op == p) continue; //all OTHER personnel
			//only need to check sol[op][t][0] because all entries will be same teacher
			if(sol[op][t].length > 0 && sol[op][t][0][1] == s.teacher)
				return -1;
		}
		
		if(sol[p][t].length > 0){ //already busy, so can only overlap
			if(!validOverlap(sol[p][t],s))
				return -1;
			else
				ret = 1; //prioritize overlap (even if otherwise subopt)
		}
		tleft -= 10;
		t++;
	}while(tleft > 0);
	
	return ret;
}

//return list of [person,time,fit] tuples
//	person is index into Personnel
//	time is index into masterSched/sol[p]
//	fit is 0 for sub, 1 for opt (as above)
function findAllFits(sol,curr,doShuffle=true){
	let ret = [];
	//randomize which Person is considered first so repeated searches spread work
	//across different people (keeps the time ordering below intact)
	const porder = [];
	for (let p=0; p<personnel.length; p++) porder.push(p);
	if (doShuffle) shuffle(porder);
	//FIXED: go backwards so that earlier times are on top of stack
	for (let t=blocklabels.length-1; t>=0; t--){
		const mfit = masterFit(curr,t);
		if(mfit < 0){ //just doesn't fit
			continue;
		}

		for (const p of porder){
			const pfit = personFit(sol,curr,p,t);
			if (pfit < 0){
				continue;
			}
			let fit = 1;
			if (pfit == 0 || mfit == 0)
				fit = 0;
			ret.push([p,t,fit]);
		}
	}
	return ret;
}

function emptySol(){
	let sol = {};
	for (let p=0; p<personnel.length; p++){
		sol[p] = Array.from({ length: blocklabels.length }, () => []);
	}
	return sol;
}

//comparator for sorting services
function servComp(a,b){
	const aBeh = a.cat.includes("Behav");
	const bBeh = b.cat.includes("Behav");
	if(aBeh && !bBeh)
		return 1;
	else if(!aBeh && bBeh)
		return -1;
	
	const sol = emptySol();
	const afits = findAllFits(sol,a,false).length;
	const bfits = findAllFits(sol,b,false).length;
	if (afits == bfits)
		return 0;
	else if (afits > bfits)
		return 1; //b should come first
	else //bfits > afits
		return -1;
}

//gen solution for given list of services, starting with `sol` (emptySol())
//	DOESN'T RETURN: clears and fills SOLS (and SUBS)
function solveServices(inservs, sol){
	SOLS = []; //complete solutions found (raw, before the diversity filter below)
	SUBS = []; //complete, but suboptimal solutions

	searchSeed = SEARCH_SEED;   //deterministic run
	const acceptedSOLS = [];    //curated: each is a distinct schedule (see isDiverse)
	const nearDupSOLS = [];     //complete but too similar to an accepted one (fallback only)
	let vetted = 0;             //how many of SOLS have been diversity-checked so far
	const startMs = performance.now();

	//sort servs here
	const servs = [];
	let anyservs = false;
	for (let pl of inservs){
		if (pl.length>0) anyservs = true;
		pl.sort(servComp);
		servs.push(pl);
	}
	
	if (!anyservs){
		SOLS = [sol];
		return;
	}
	
	//each entry is a stack of [sol, next_i] tuples (for the priority matching list index)
	//next_i is the next serv index to try to add to the sol (simple inc)
	//sol[ution] is objs with
	//	Person's index in `personnel` as key and
	//	val as list of services in 10 min incs
	//		each service (list element) is itself a list [teach, svcat, stud] tuples
	//			(use Service.toEntry())
	solStacks = Array.from({ length: servs.length }, () => []);
	subStacks = Array.from({ length: servs.length }, () => []);

	//per-service attempt budget; reset whenever a full solution is found so later
	//solutions aren't starved by exploration spent on earlier ones
	let triesArr = servs.map(pl => new Array(pl.length).fill(0));

	solStacks[0].push([sol,0]);
	
	function sol2Str(sl){
		let ret = "";
		for (let p=0; p<personnel.length; p++){
			ret += sl[p].map(row => row.join(',')).join('\n');
		}
		return ret;
	}
	
	let opts = 0; //just curious: stat of how many options are explored
	
	staxMax = [0,0,0];
	
	let diffSOLS = 10; //collect this many + 1 distinct schedules, then stop

	//classify newly-completed solutions: a solution that differs enough from the ones
	//already accepted counts toward the "enough distinct schedules" stop condition.
	//(all complete solutions stay in SOLS regardless â€” this only paces the search.)
	function vetNewSOLS(){
		triesArr = servs.map(pl => new Array(pl.length).fill(0)); //fresh budget per solution
		for (; vetted < SOLS.length; vetted++){
			if (isDiverse(SOLS[vetted], acceptedSOLS)){
				acceptedSOLS.push(SOLS[vetted]);
				diffSOLS--;
			}
			else
				nearDupSOLS.push(SOLS[vetted]);
		}
	}

	//use `const deepCopy = structuredClone(original);` to copy sol objs!
	while(true){
		//get current highest pi
		if(diffSOLS < 0)
			break; //enough distinct schedules found
		if(SOLS.length > 0 &&
			(opts > SEARCH_MAX_OPTS || (performance.now() - startMs) > SEARCH_MAX_MS))
			break; //have at least one schedule and hit a soft budget
		if(opts > SEARCH_HARD_OPTS)
			break; //absolute backstop
		let foundSOL = false; //one per sol
		let pi = 0;
		if (solStacks[2].length > 0)
			pi = 2;
		else if (solStacks[1].length > 0)
			pi = 1;
		const lastpi = pi == servs.length-1;
		
		//TEMP record stats...
		for(let i=0; i<3; i++){
			if (solStacks[i].length == 0)
				continue;
			staxMax[i] = Math.max(staxMax[i], solStacks[i].at(-1)[1]);
		}
		opts++;
		//TEMP ^
		
		//FIXED: moved to top of loop, because bottom doesn't have next pi.
		//when solStacks[pi] is empty AND we're desperate (no sols in next pi or SOLS, where approp.):
		//then copy over the top suboptimal solution and keep going
		if (((!lastpi && solStacks[pi+1].length == 0) || (lastpi && SOLS.length == 0)) &&
			solStacks[pi].length == 0 && subStacks[pi].length > 0){
			solStacks[pi].push(subStacks[pi].pop()); //move top suboptimal to sol
		}
		
		//pop solution stack
		if(solStacks[pi].length == 0){
			console.log(solStacks);
			console.log(subStacks);
			throw new Error("solStacks[pi].length == 0");
		}
		let [sol, next_i] = solStacks[pi].pop();
		
		const lastserv = next_i == servs[pi].length-1;
		
		while(servs[pi].length == 0)
			pi++;
			if (pi >= servs.length)
				return sol;
		
		const curr = servs[pi][next_i];
		//console.log("Fitting",pi,next_i,":",curr);
		
		triesArr[pi][next_i]++;
		if (triesArr[pi][next_i] > 100){
			//give up on this service for now: advance past it on this branch
			let np = pi, ni = next_i + 1;
			if (ni >= servs[np].length){ //was the last service of this priority
				ni = 0;
				np++;
			}
			if (np >= servs.length){
				SOLS.push(sol);
				foundSOL = true;
				vetNewSOLS();
			}
			else
				solStacks[np].push([sol,ni]); //FIX: previously pushed next_i+1, skipping service 0
			continue;
		}
		//if(staxMax[pi] == next_i) console.log("Fitting",pi,next_i,":",curr);
		//if(staxMax[pi] == next_i) console.log(solStacks[pi].length,"left");
		
		let anyopt = false;
		let anysub = false;
		
		//first complete solution uses the plain greedy person order; shuffling only
		//kicks in once we have a baseline, so diversity never costs us the best pack
		for(let tup of findAllFits(sol,curr,SOLS.length > 0)){
			const [p,t,fit] = tup;
			const solCopy = structuredClone(sol);
			
			let tleft = curr.time;
			let st = t;
			do{
				solCopy[p][st].push(curr.toEntry());
				tleft -= 10;
				st++;
			}while(tleft > 0);
			
			
			//if(staxMax[pi] == next_i) console.log("\tpfit found: ",p,t,solCopy[p][t].length);
			
			if (fit > 0){ //optimal
				anyopt = true;
				if(!lastserv){
					solStacks[pi].push([solCopy,next_i+1]);
				}
				else if (!lastpi){
					solStacks[pi+1].push([solCopy,0]);
				}
				else{
					SOLS.push(solCopy);
					foundSOL = true;
				}
			}
			else { //suboptimal
				anysub = true;
				if(!lastserv){
					subStacks[pi].push([solCopy,next_i+1]);
				}
				else if (!lastpi){
					subStacks[pi+1].push([solCopy,0]);
				}
				else{
					SUBS.push(solCopy);
				}
			}
		}
		
		//TODO: revisit?
		if(!anyopt && anysub){ //no opt found, but 1+ sub was, so treat one sub as opt ("best we've got")
			solStacks[pi].push(subStacks[pi].pop());
		}
		
		//TODO: Try splitting Services!
		//AFTER: add ALL split-up versions of this service to the suboptimal stack (right??)
		//	create a solCopy, call curr.split(), try to fit each 10 minute split-Serv in...? BUT THE OPTIONS?!!!??!
		
		if(foundSOL) vetNewSOLS();
	}

	//leave SOLS as the FULL pool of complete solutions; generateSchedule picks the
	//one with the fewest misses. acceptedSOLS/nearDupSOLS only shaped how long we
	//kept searching (until enough *distinct* schedules exist, or a cap is hit).
	console.log("Considered",opts,"options;",SOLS.length,"solutions (",acceptedSOLS.length,"distinct )");
}

// ============================================================================
// Constraint-aware constructor + repair
//   greedySolve : most-constrained-service-first (MRV), least-constraining-slot (LCV)
//   repairInPlace : ejection-chain local search that only ever lowers the miss count
// A "place" map (Service object -> {p,t,span}) rides alongside the tuple-format
// `sol` so pieces can be moved/undone without reconstructing Service data.
// ============================================================================

let masterStartCache = new Map(); //reset per generateSchedule run

function entryKey(e){ return [e[1],e[2],e[3],e[4]].join(String.fromCharCode(1)); }

//is toEntry() `e` present anywhere in solution `sol`?
function solHasE(sol,e){
	const k = entryKey(e);
	for(const p of Object.keys(sol))
		for(const cell of sol[p])
			for(const le of cell)
				if (entryKey(le) === k) return true;
	return false;
}

//variance of per-person busy-block counts; lower => workload shared more evenly
function loadImbalance(sol){
	const loads = [];
	for(const p of Object.keys(sol)){
		let busy = 0;
		for(const cell of sol[p]) if (cell.length > 0) busy++;
		loads.push(busy);
	}
	if (loads.length === 0) return 0;
	const mean = loads.reduce((a,b)=>a+b,0) / loads.length;
	let v = 0;
	for(const l of loads) v += (l-mean)*(l-mean);
	return v / loads.length;
}

//services in `buckets` whose entry appears nowhere in `sol`
function countMissesFlat(sol, buckets){
	const out = [];
	for (const k of Object.keys(buckets))
		for (const s of buckets[k])
			if (!solHasE(sol, s.toEntry())) out.push(s);
	return out;
}

//distinct feasible start blocks for a service, cached (masterFit ignores the partial solution)
function masterStarts(s){
	const key = s.grade+'|'+s.cat+'|'+(s.isPushIn?1:0)+'|'+s.time;
	let v = masterStartCache.get(key);
	if (!v){
		v = [];
		for (let t=0; t<blocklabels.length; t++){
			const q = masterFit(s, t);
			if (q >= 0) v.push([t, q]);
		}
		masterStartCache.set(key, v);
	}
	return v;
}

//every (person,start) where `s` currently fits `sol`; q is 0 (suboptimal) or 1 (optimal)
function findFits(sol, s){
	const out = [];
	for (const [t, qm] of masterStarts(s)){
		for (let p=0; p<personnel.length; p++){
			const pf = personFit(sol, s, p, t);
			if (pf < 0) continue;
			out.push({p, t, q: Math.min(qm, pf)});
		}
	}
	return out;
}

function bestOf(fits){
	let b = fits[0];
	for (const f of fits) if (f.q > b.q) b = f;
	return b;
}

function applyPlacement(sol, place, s, p, t){
	const e = s.toEntry();
	const span = Math.ceil(s.time/10);
	for (let k=0;k<span;k++) sol[p][t+k].push(e);
	place.set(s, {p, t, span});
}

function undoPlacement(sol, place, s){
	const rec = place.get(s);
	if (!rec) return;
	const k0 = entryKey(s.toEntry());
	for (let k=0;k<rec.span;k++){
		const cell = sol[rec.p][rec.t+k];
		for (let j=cell.length-1;j>=0;j--){
			if (entryKey(cell[j]) === k0){ cell.splice(j,1); break; }
		}
	}
	place.delete(s);
}

//score each candidate slot by how much placement freedom it leaves other services
//(this is the "move it down so the other one fits" logic, made systematic)
function pickLCV(sol, s, fits, remaining){
	const cand  = fits.length > LCV_FIT_LIMIT ? fits.slice(0, LCV_FIT_LIMIT) : fits;
	const probe = remaining.length > LCV_PROBE_LIMIT ? remaining.slice(0, LCV_PROBE_LIMIT) : remaining;
	const e = s.toEntry();
	const span = Math.ceil(s.time/10);

	let best = fits[0], bestScore = -Infinity;
	for (const f of cand){
		for (let k=0;k<span;k++) sol[f.p][f.t+k].push(e);  //tentative
		let freedom = 0;
		for (const o of probe) freedom += findFits(sol, o.s).length;
		for (let k=0;k<span;k++) sol[f.p][f.t+k].pop();    //undo

		let score = freedom;
		if (f.q === 1) score += LCV_OPT_BONUS;
		const before = f.t > 0 && sol[f.p][f.t-1].length > 0;
		const after  = f.t+span < blocklabels.length && sol[f.p][f.t+span].length > 0;
		if (before || after) score += LCV_ADJ_BONUS;
		if (personnel[f.p].grades.includes(s.grade)) score += LCV_GRADE_BONUS;

		if (score > bestScore){ bestScore = score; best = f; }
	}
	return best;
}

//most-constrained-first / least-constraining-slot greedy build on top of `baseSol`
function greedySolve(buckets, baseSol){
	const sol = structuredClone(baseSol);
	const place = new Map();
	const missed = [];

	//findFits only ever shrinks as the schedule fills, so cache it and drop entries
	//touched by a placement (same person, or same teacher via the exclusivity rule)
	const fitCache = new Map();
	const cachedFits = s => {
		let f = fitCache.get(s);
		if (!f){ f = findFits(sol, s); fitCache.set(s, f); }
		return f;
	};

	for (let pi=0; pi<buckets.length; pi++){
		const remaining = buckets[pi].map(s => ({s}));

		while (remaining.length){
			//MRV: the service with the fewest placements available right now
			let pick = 0, pickFits = cachedFits(remaining[0].s);
			for (let i=1; i<remaining.length && pickFits.length>0; i++){
				const f = cachedFits(remaining[i].s);
				if (f.length < pickFits.length){ pick = i; pickFits = f; }
			}
			const chosen = remaining.splice(pick,1)[0].s;

			if (pickFits.length === 0){ missed.push(chosen); continue; }

			const c = pickLCV(sol, chosen, pickFits, remaining);
			applyPlacement(sol, place, chosen, c.p, c.t);

			fitCache.delete(chosen);
			for (const {s} of remaining){
				const f = fitCache.get(s);
				if (!f) continue;
				if (s.teacher === chosen.teacher || f.some(x => x.p === c.p))
					fitCache.delete(s);
			}
		}
	}
	return {sol, place, missed};
}

function servicesCovering(place, p, t){
	const out = [];
	for (const [s, rec] of place)
		if (rec.p === p && rec.t <= t && t < rec.t + rec.span) out.push(s);
	return out;
}

//services that would have to move for `m` to occupy (p,t); null if a hard rule forbids it
function blockersFor(sol, place, m, p, t){
	const person = personnel[p];
	if (!m.isSupport && person.isIA) return null;
	if (person.name.includes("Spendlove") && m.teacher.includes("Kelly")) return null;

	const span = Math.ceil(m.time/10);
	const set = new Set();
	for (let k=0;k<span;k++){
		const tt = t+k;
		if (tt >= blocklabels.length) return null;
		for (const s of servicesCovering(place, p, tt)) set.add(s);
		for (let op=0; op<personnel.length; op++){
			if (op === p) continue;
			for (const s of servicesCovering(place, op, tt))
				if (s.teacher === m.teacher) set.add(s);
		}
	}
	return [...set];
}

function snapshot(sol, place){
	return {
		sol: structuredClone(sol),
		place: new Map([...place].map(([s,r])=>[s,{...r}]))
	};
}
function restore(sol, place, snap){
	for (const p of Object.keys(snap.sol))
		for (let t=0;t<snap.sol[p].length;t++) sol[p][t] = snap.sol[p][t];
	place.clear();
	for (const [s,r] of snap.place) place.set(s, r);
}

//place `m` by displacing its blockers (and, up to `depth`, their blockers); all-or-nothing
function tryEject(sol, place, m, depth, locked){
	locked = locked || new Set();
	locked.add(m);

	for (const [t] of masterStarts(m)){
		for (let p=0; p<personnel.length; p++){
			const blockers = blockersFor(sol, place, m, p, t);
			if (blockers === null) continue;
			if (blockers.length === 0 || blockers.length > EJECT_MAX_BLOCKERS) continue;
			if (blockers.some(b => locked.has(b))) continue;
			//never displace a higher-priority service (locked cat < instruction < support)
			//to make room for a lower-priority one
			if (blockers.some(b => b.getPriority() < m.getPriority())) continue;

			const snap = snapshot(sol, place);
			for (const b of blockers) undoPlacement(sol, place, b);

			if (personFit(sol, m, p, t) < 0){ restore(sol, place, snap); continue; }
			applyPlacement(sol, place, m, p, t);

			let ok = true;
			for (const b of blockers){
				const f = findFits(sol, b);
				if (f.length){
					const c = bestOf(f);
					applyPlacement(sol, place, b, c.p, c.t);
				}
				else if (depth > 0 && tryEject(sol, place, b, depth-1, locked)){ /* rehomed deeper */ }
				else { ok = false; break; }
			}
			if (ok) return true;
			restore(sol, place, snap);
		}
	}
	return false;
}

//local search: work the miss list down; every accepted move keeps or lowers the count
function repairInPlace(g){
	let changed = true, iter = 0;
	while (changed && iter++ < REPAIR_MAX_ITERS){
		changed = false;
		for (let i=0; i<g.missed.length; i++){
			const m = g.missed[i];
			const direct = findFits(g.sol, m);
			if (direct.length){
				const c = bestOf(direct);
				applyPlacement(g.sol, g.place, m, c.p, c.t);
				g.missed.splice(i,1); i--; changed = true; continue;
			}
			if (tryEject(g.sol, g.place, m, EJECT_DEPTH)){
				g.missed.splice(i,1); i--; changed = true; continue;
			}
		}
	}
}

function solKey(sol){
	return Object.keys(sol)
		.map(p => sol[p].map(cell => blockKey(cell)).join('|'))
		.join('#');
}
function dedupeSols(list){
	const seen = new Set(), out = [];
	for (const s of list){
		const k = solKey(s);
		if (!seen.has(k)){ seen.add(k); out.push(s); }
	}
	return out;
}

		Kservs = [[],[],[]];
		const servcats = new Set(); //set of seen service categories, for validation
		
		for (let i=1; i<servData.length; i++){
			const row = servData[i];
			if (row.length == 0 || row[0].trim().length == 0) continue;
			
			let cat = row[4];
			if (cat.startsWith("Trans")){
				let subcats = null;
				const ttype = cat.split(" ")[1].trim().toLowerCase();
				if (ttype.includes("recess")){
					subcats = ["recess in"];
				}
				else if (ttype.includes("resource")){
					subcats = ["res_in","res_out"];
				}
				else if (ttype.includes("begin")){
					subcats = ["begin","end"];
				}
				for (let subcat of subcats){
					//Service(name, grade, teacher, cat, isSupport, isPushIn, time)
					const s = new Service(
						row[0],
						parseGrade(row[2]),
						row[3],
						"Transition "+subcat,
						row[5].toUpperCase() == "SUPPORT",
						row[9][0].toUpperCase() == "G",
						10
					);
					const pi = s.getPriority();
					s.grade==0 ? Kservs[pi].unshift(s) : servs[pi].unshift(s);
				}
			}
			else{
				let time = roundUp(parseInt(row[7]));
				if (reduceVal == "3/4"){
					time = roundUp(time*.75);
				}
				else if (reduceVal == "Half"){
					time = roundUp(time*.5);
				}
				const ts = [];
				if (time <= 40){
					ts.push(time);
				}
				else{
					while(true){
						if (time >= 60){
							time -= 30;
							ts.push(30);
						}
						else if (time == 50){
							ts.push(30);
							ts.push(20);
							break;
						}
						else if (time == 40){
							ts.push(20);
							ts.push(20);
							break;
						}
						else{
							ts.push(time);
							break;
						}
					}
				}
				for (const t of ts){
					//Service(name, grade, teacher, cat, isSupport, isPushIn, time)
					const s = new Service(
						row[0],
						parseGrade(row[2]),
						row[3],
						cat,
						row[5].toUpperCase() == "SUPPORT",
						row[9][0].toUpperCase() == "G",
						t
					);
					if (!s.cat.startsWith("Trans") && !s.cat.startsWith("Behav")) //transitions and behavior don't appear on master sched
						servcats.add(s.cat);
					
					const pi = s.getPriority();
					if(s.cat.includes("Behav"))
						//Add Behavs to BOTTOM of stack because they're flexible
						s.grade==0 ? Kservs[pi].push(s) : servs[pi].push(s);
					else
						s.grade==0 ? Kservs[pi].unshift(s) : servs[pi].unshift(s);
				}
			}
		}
		
		console.log("Loaded services:",servs);
		console.log("Loaded KINDER servs:",Kservs);
		
		//validate
		if (!servcats.isSubsetOf(schedCats)){
			const missing = servcats.difference(schedCats);
			const msg = "Some service categories don't appear on master schedule: "+[...missing].join(', ');
			alert("ERROR! "+msg);
			throw new Error(msg);
		}
		console.log("Sched entries that aren't in service cats: ",schedCats.difference(servcats));
		
		for(let k of Object.keys(masterSched)){
			if (masterSched[k].length != blocklabels.length){
				throw new Error("sched "+k+" len != labels len: "+ masterSched[k].length+ " vs. "+ blocklabels.length);
			}
		}
		
		ready = true;
    } catch (error) {
        console.error('Error loading data:', error);
        alert('There was a problem loading the data.');
    }
	
	if (!ready) return;
	console.log("---------------------------");
	
	// =====================================================
	// Schedule-generation logic
	let kMiss = [];
	let candidates = [];   // {sol, kmiss} — complete non-Kinder schedules to choose among
	try{
		masterStartCache = new Map();   // master schedule was just rebuilt

		// ---- Kinder phase: gather a few distinct starting points ----
		const kBases = [];
		solveServices(Kservs, emptySol());
		for (const s of dedupeSols(SOLS))
			kBases.push({sol: s, miss: countMissesFlat(s, Kservs)});
		try {
			const g = greedySolve(Kservs, emptySol());
			repairInPlace(g);
			kBases.push({sol: g.sol, miss: countMissesFlat(g.sol, Kservs)});
		} catch (e) { console.warn("greedy Kinder solve failed, using DFS bases only:", e); }
		if (kBases.length === 0)
			throw new Error("Couldn't complete Kinder schedule before moving on to non-Kinder");
		kBases.sort((a,b) => a.miss.length - b.miss.length);
		const topK = kBases.slice(0, KBASE_LIMIT);
		console.log("Kinder bases (misses):", kBases.map(b => b.miss.length), "-> using", topK.length);

		// ---- non-Kinder phase: build candidates on each Kinder base ----
		for (let bi=0; bi<topK.length; bi++){
			const base = topK[bi].sol;

			try {
				const g = greedySolve(servs, base);
				repairInPlace(g);
				candidates.push({sol: g.sol, kmiss: topK[bi].miss});
			} catch (e) { console.warn("greedy non-Kinder solve failed on base", bi, ":", e); }

			if (bi === 0){   // the deep DFS is expensive: run it only on the best base
				solveServices(servs, structuredClone(base));
				for (const s of SOLS)
					candidates.push({sol: s, kmiss: topK[bi].miss});
			}
		}
		if (candidates.length === 0)
			throw new Error("No complete schedule could be built");
		ready = true;
	} catch (error) {
        console.error('Error generating schedule:', error);
        alert('There was a problem generating the schedule.');
    }
	
	if (!ready) return;
	
	console.log("Candidates:", candidates.length);

	//solHasE / loadImbalance now live at module scope

	let sol = null;
	let miss = null;
	let bestTotal = Infinity;
	let bestImb = Infinity;

	for (const c of candidates){
		const currmiss = [];
		for (const k of Object.keys(servs))
			for (const s of servs[k])
				if (!solHasE(c.sol, s.toEntry())) currmiss.push(s);
		const total = c.kmiss.length + currmiss.length;
		const imb = loadImbalance(c.sol);
		console.log("\tcandidate misses:", total, "( K", c.kmiss.length, "+", currmiss.length, ") imbalance:", imb.toFixed(2));
		//fewest total unplaced services wins; ties broken toward the most balanced workload
		if (miss === null || total < bestTotal || (total === bestTotal && imb < bestImb)){
			sol = c.sol;
			miss = currmiss;
			kMiss = c.kmiss;
			bestTotal = total;
			bestImb = imb;
		}
	}

	//fold the Kinder drops (not present in `servs`) into the reported miss list
	miss = kMiss.concat(miss);

	console.log("Selected solution:", sol, "total misses:", bestTotal, "imbalance:", bestImb);
	console.log("Misses:", miss, "(incl.", kMiss.length, "Kinder)");

	if(miss.length > 0){
		const parent = document.getElementById('missing-ul');
		parent.replaceChildren();
		document.getElementById("results").style.display = "block";
		for (let ms of miss){
			const li = document.createElement("li");
			li.textContent = entry2Str(ms.toEntry());
			parent.appendChild(li);
		}
	}
	
	//prep data
	const row1 = [""];
	for (let p of personnel){
		row1.push(p.name);
	}
	const data = [row1];
	for(let i=0; i<blocklabels.length;i++){
		const row = [blocklabels[i]];
		for(let p of Object.keys(sol)){
			row.push(entriesOutStr(sol[p][i]));
		}
		data.push(row);
	}
	
	//TEMP: direct download
	const workbook = XLSX.utils.book_new();
	const worksheet = XLSX.utils.aoa_to_sheet(data);
	XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");

	// Triggers an automatic browser download
	XLSX.writeFile(workbook, "ComputedSchedule.xlsx");
	
	// =====================================================
}

async function runSchedule() {
    const loadingOverlay = document.getElementById('loadingOverlay');

    loadingOverlay.style.display = 'flex';
	genButton.disabled = true;
	document.getElementById("results").style.display = "none";

    // Give the browser time to display the overlay
    await new Promise(resolve => setTimeout(resolve, 0));

    try {
        await generateSchedule();
    } finally {
        loadingOverlay.style.display = 'none';
		filesSelected();
    }
}

// Add/delete personnel rows.
personnelRows.addEventListener('click', event => {
    const addButton = event.target.closest('.personnel-add');
    const deleteButton = event.target.closest('.personnel-delete');

    if (addButton) {
        addPersonnelRow();
    } else if (deleteButton) {
        deletePersonnelRow(deleteButton.closest('.personnel-row'));
    }
});

// Keep Generate Schedule disabled until both files have been selected.
schedInput.addEventListener('change', filesSelected);
servInput.addEventListener('change', filesSelected);
genButton.addEventListener('click', runSchedule);

// Set the initial state.
filesSelected();
updateDeleteButtons();

</script>
